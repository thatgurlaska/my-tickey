<!-- ==================================
     HOME — TICKEY WORKSHOP
     ================================== -->

<div id="homePage" class="page home-page">

    <header class="home-header">
        <div>
            <div class="system-label">MY TICKEY</div>
            <h1>Workshop</h1>
        </div>

        <div class="device-status">
            <span class="status-dot"></span>
            WEB
        </div>
    </header>


    <!-- DEVICE -->

    <section class="home-section">
        <div class="home-section-header">
            <div>
                <div class="section-kicker">DEVICE</div>
                <h2>TICKEY</h2>
            </div>
            <span class="section-meta">NOT CONNECTED</span>
        </div>

        <div class="today-card">
            <div class="today-date">
                <span>DEVICE STATUS</span>
                <strong>—</strong>
            </div>

            <div class="today-divider"></div>

            <div class="today-placeholder">
                <span class="today-placeholder-icon">T</span>
                <div>
                    <strong>Your TICKEY will live here.</strong>
                    <p>Battery, storage and sync status will appear once device support is ready.</p>
                </div>
            </div>
        </div>
    </section>


    <!-- TOOLS -->

    <section class="home-section">
        <div class="home-section-header">
            <div>
                <div class="section-kicker">YOUR TOOLS</div>
                <h2>Tools</h2>
            </div>
        </div>

        <div class="module-grid">

            <button id="todoButton" class="module-card">
                <div class="module-top">
                    <span class="module-icon">✓</span>
                    <span class="module-arrow">↗</span>
                </div>
                <div class="module-content">
                    <strong>To-do</strong>
                    <span>Tasks & lists</span>
                </div>
            </button>

            <button class="module-card module-card-disabled">
                <div class="module-top">
                    <span class="module-icon">▧</span>
                    <span class="module-tag">SOON</span>
                </div>
                <div class="module-content">
                    <strong>Gallery</strong>
                    <span>Images for TICKEY</span>
                </div>
            </button>

            <button id="crochetButton" class="module-card">
                <div class="module-top">
                    <span class="module-icon">⌁</span>
                    <span class="module-arrow">↗</span>
                </div>
                <div class="module-content">
                    <strong>Crochet</strong>
                    <span>Projects & patterns</span>
                </div>
            </button>

            <button class="module-card module-card-disabled">
                <div class="module-top">
                    <span class="module-icon">▤</span>
                    <span class="module-tag">SOON</span>
                </div>
                <div class="module-content">
                    <strong>Quick Cards</strong>
                    <span>Make a card</span>
                </div>
            </button>

        </div>
    </section>


    <!-- TICKEY SETUP -->

    <section class="home-section">
        <div class="home-section-header">
            <div>
                <div class="section-kicker">TICKEY SETUP</div>
                <h2>Configure</h2>
            </div>
        </div>

        <div class="module-grid">

            <button class="module-card module-card-disabled">
                <div class="module-top">
                    <span class="module-icon">⌂</span>
                    <span class="module-tag">SOON</span>
                </div>
                <div class="module-content">
                    <strong>Home</strong>
                    <span>Display & priorities</span>
                </div>
            </button>

            <button class="module-card module-card-disabled">
                <div class="module-top">
                    <span class="module-icon">◷</span>
                    <span class="module-tag">SOON</span>
                </div>
                <div class="module-content">
                    <strong>Modes</strong>
                    <span>Focus & travel</span>
                </div>
            </button>

            <button class="module-card module-card-disabled">
                <div class="module-top">
                    <span class="module-icon">⌁</span>
                    <span class="module-tag">SOON</span>
                </div>
                <div class="module-content">
                    <strong>Actions</strong>
                    <span>NFC & Find My Phone</span>
                </div>
            </button>

        </div>
    </section>


    <!-- NAVI -->

    <section class="navi-card">
        <div class="navi-orb">
            <span class="navi-wing navi-wing-left"></span>
            <span class="navi-core"></span>
            <span class="navi-wing navi-wing-right"></span>
        </div>

        <div class="navi-message">
            <div class="navi-name">NAVI</div>
            <p>Still building my house, I see.</p>
        </div>
    </section>


    <!-- FOOTER -->

    <footer class="home-footer">
        <span>MY TICKEY</span>
        <span>LOCAL SYSTEM</span>
    </footer>

</div>
